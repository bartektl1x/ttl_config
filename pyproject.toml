[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttl-config"
version = "0.1.0"
description = "Retention configuration for Unity Catalog tables"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
databricks = [
    "pyspark>=3.5,<4",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
